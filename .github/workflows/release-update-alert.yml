name: Android update alerts
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && 'Validate Firebase without delivery' || 'Send Android update alert' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact latest release tag to send an alert for. Leave blank to test Firebase.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  update-alert:
    name: Validate release and notify
    if: >-
      github.repository == 'FriiZoLoGYy/aiu-radio-android-app' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch) ||
       (github.event_name == 'release' &&
        !github.event.release.draft && !github.event.release.prerelease))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: aiu-radio-update-alert-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && 'validate' || 'send' }}
      cancel-in-progress: false

    steps:
      - name: Verify the published release and Universal APK
        id: release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = "FriiZoLoGYy/aiu-radio-android-app"
          request = Request(
              f"https://api.github.com/repos/{repository}/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ.pop('GH_TOKEN')}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=20) as response:
              release = json.load(response)

          if release["draft"] or release["prerelease"] or not release["published_at"]:
              raise SystemExit("GitHub must have a published stable release.")
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              if event["release"]["id"] != release["id"]:
                  raise SystemExit("Only the release marked latest in GitHub can trigger an alert.")
          elif os.environ["REQUESTED_RELEASE_TAG"] != release["tag_name"]:
              raise SystemExit("Enter the exact tag of the latest stable release.")

          tag = release["tag_name"]
          if not re.fullmatch(r"[vV]?[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}", tag):
              raise SystemExit("Tag the release with the APK version name, such as v0.8.0.")
          version_name = tag.lstrip("vV")

          assets = [
              asset for asset in release["assets"]
              if asset["name"].lower().endswith(".apk") and asset["state"] == "uploaded"
          ]
          stem = f"AIU-Radio-v{version_name}"
          universal = f"{stem}-universal.apk"
          expected = {
              universal,
              f"{stem}-arm64-v8a.apk",
              f"{stem}-armeabi-v7a.apk",
              f"{stem}-x86_64.apk",
          }
          names = {asset["name"] for asset in assets}
          if len(assets) == 1 and names == {f"{stem}.apk"}:
              asset = assets[0]
          elif len(assets) == len(expected) and names == expected:
              asset = next(asset for asset in assets if asset["name"] == universal)
          else:
              raise SystemExit("Attach all four versioned Android APKs, including Universal, or one legacy unqualified APK.")
          name = asset["name"]
          size = asset["size"]
          url = f"https://github.com/{repository}/releases/download/{tag}/{quote(name, safe='')}"
          if asset["browser_download_url"] != url or not 1 <= size <= 96 * 1024 * 1024:
              raise SystemExit("The release APK has an invalid download URL or size.")
          digest = re.fullmatch(r"sha256:([A-Fa-f0-9]{64})", asset.get("digest") or "")
          if digest is None:
              raise SystemExit("GitHub did not provide a SHA-256 digest for the attached APK.")

          with urlopen(url, timeout=60) as response:
              apk = response.read(size + 1)
          if len(apk) != size or hashlib.sha256(apk).hexdigest() != digest.group(1).lower():
              raise SystemExit("The attached APK's size or SHA-256 differs from GitHub's asset metadata.")

          build_tools = Path(os.environ["ANDROID_HOME"], "build-tools")
          aapt = max(
              build_tools.glob("*/aapt2"),
              key=lambda tool: tuple(map(int, re.findall(r"[0-9]+", tool.parent.name))),
              default=None,
          )
          if aapt is None or not aapt.with_name("apksigner").is_file():
              raise SystemExit("Android Build Tools are missing from the GitHub runner.")
          with tempfile.TemporaryDirectory() as directory:
              apk_file = Path(directory, "release.apk")
              apk_file.write_bytes(apk)
              signing = subprocess.run(
                  [aapt.with_name("apksigner"), "verify", apk_file],
                  capture_output=True, timeout=30,
              )
              if signing.returncode != 0:
                  raise SystemExit("The attached APK does not have a valid Android signature.")
              badging = subprocess.run(
                  [aapt, "dump", "badging", apk_file],
                  capture_output=True, check=True, text=True, timeout=30,
              ).stdout
          package = re.search(
              r"^package: name='([^']+)' versionCode='([0-9]{1,10})' versionName='([^']*)'",
              badging, re.MULTILINE,
          )
          if package is None or package.group(1) != "fm.aiu.radio":
              raise SystemExit("The attached APK must have the AIU Radio package fm.aiu.radio.")
          version_code = int(package.group(2))
          if not 1 <= version_code <= 2147483647:
              raise SystemExit("The attached APK must have a positive Android versionCode.")
          if package.group(3) != version_name:
              raise SystemExit("The GitHub tag and the APK's Android versionName must match.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version_code={version_code}", file=output)
              print(f"version_name={version_name}", file=output)
          print(f"Verified {name}, version code {version_code}.")
          PY

      - name: Notify via Firebase or validate without delivery
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import subprocess
          import tempfile

          project = "aiu-app-c9305"
          topic = "aiu-radio-app-updates"
          secret = os.environ.pop("FIREBASE_SERVICE_ACCOUNT_JSON", "")
          if not secret:
              raise SystemExit("Add the FIREBASE_SERVICE_ACCOUNT_JSON repository secret in GitHub.")
          credentials = json.loads(secret)
          if credentials.get("type") != "service_account" or credentials.get("project_id") != project:
              raise SystemExit(f"Use a service account key from the {project} project.")

          with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8") as key:
              key.write(secret)
              key.flush()
              token_result = subprocess.run(
                  ["gcloud", "auth", "application-default", "print-access-token",
                   "--scopes=https://www.googleapis.com/auth/firebase.messaging"],
                  env={**os.environ, "GOOGLE_APPLICATION_CREDENTIALS": key.name},
                  capture_output=True, text=True, timeout=45,
              )
          if token_result.returncode != 0 or not token_result.stdout.strip():
              raise SystemExit("Google Cloud could not authenticate. Check the service account key.")

          validate_only = (
              os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              and not os.environ["REQUESTED_RELEASE_TAG"]
          )
          version_code = "1" if validate_only else os.environ["ANDROID_VERSION_CODE"]
          version_name = "0.0.1" if validate_only else os.environ["ANDROID_VERSION_NAME"]
          if not version_code or not version_name:
              raise SystemExit("The release APK must be verified before sending an update alert.")
          body = json.dumps({
              "validate_only": validate_only,
              "message": {
                  "topic": topic,
                  "data": {
                      "type": "app_update", "versionCode": version_code, "versionName": version_name,
                  },
                  "android": {"priority": "NORMAL", "ttl": "259200s", "collapse_key": topic},
              },
          })
          connection = http.client.HTTPSConnection("fcm.googleapis.com", timeout=30)
          try:
              connection.request("POST", f"/v1/projects/{project}/messages:send", body, {
                  "Authorization": f"Bearer {token_result.stdout.strip()}",
                  "Content-Type": "application/json",
              })
              response = connection.getresponse()
              if response.status != 200:
                  raise SystemExit(
                      f"Firebase returned HTTP {response.status}. "
                      "Check that the FCM API is enabled and the account has Firebase Cloud Messaging API Admin."
                  )
              receipt = json.load(response)
          finally:
              connection.close()

          if validate_only:
              print("Firebase validated the update message without delivery.")
          elif receipt.get("name"):
              print("Firebase accepted the update alert.")
          else:
              raise SystemExit("Firebase did not return an alert message ID.")
          PY
